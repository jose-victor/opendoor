name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11" # minimum supported version (README)
      - run: python pipeline/collect.py selftest
      - run: python pipeline/skills.py
      - run: python pipeline/guides.py selftest
      - run: python pipeline/opportunities.py selftest
      # Runs the profile and beginner-badge self-tests, then a full build against the versioned database.
      # data/raw/ is not in git, so review times come out empty here; the output is discarded.
      - run: python pipeline/build.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build # no GEMINI_API_KEY: only /api/explain needs it, at request time
